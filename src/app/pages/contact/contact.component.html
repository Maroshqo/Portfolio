<div class="contact-container">
  <h1>Contact Me</h1>

  <div class="contact-content">
    <div class="contact-info">
      <!-- Email Card: not fully clickable, email selectable, copy button included -->
      <div class="info-card email-card">
        <i class="fas fa-envelope"></i>
        <h3>Email</h3>
        <div class="email-row">
          <span class="email-text" id="email-address">maros.vatascin&#64;gmail.com</span>
          <button class="copy-btn" (click)="copyEmail()" title="Copy email">
            <i class="fas fa-copy"></i>
          </button>
        </div>
      </div>

      <!-- LinkedIn Card: whole card clickable -->
      <a class="info-card linkedin-card" href="https://www.linkedin.com/in/maros-vatascin/" target="_blank" rel="noopener">
        <i class="fab fa-linkedin"></i>
        <h3>LinkedIn</h3>
        <span class="linkedin-desc">View Profile</span>
      </a>
    </div>
  </div>
</div>
