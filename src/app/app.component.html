<!-- Modern Navigation and Layout -->
<nav class="main-nav" [class.mobile-open]="isMobileMenuOpen" clickOutside (clickOutside)="isMobileMenuOpen ? closeMobileMenu() : null">
  <div class="nav-brand" routerLink="/" (click)="closeMobileMenu()">Portfolio</div>
  
  <button class="mobile-menu-toggle" (click)="toggleMobileMenu()">
    <i class="fas fa-bars"></i>
  </button>
  
  <div class="nav-links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">
      <i class="fas fa-home"></i>
      Home
    </a>
    <a routerLink="/projects" routerLinkActive="active" (click)="closeMobileMenu()">
      <i class="fas fa-code"></i>
      Software Development
    </a>
    <a routerLink="/ai-tools" routerLinkActive="active" (click)="closeMobileMenu()">
      <i class="fas fa-brain"></i>
      AI Integrations
    </a>
    <a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">
      <i class="fas fa-envelope"></i>
      Contact
    </a>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
